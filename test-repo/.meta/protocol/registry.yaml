# vault-wiki 字段注册表（协议工件，聚合投影）
#
# 规则：
# - 协议段（protocol）是权威源，修订须过 check
# - 插件段（plugins）聚合自各 PLUGIN.yaml 的 fields 声明；check 校验一致，偏差以 PLUGIN.yaml 为准重写本表
# - 预留段（reserved）是回填通道：合法暂存字段，ghost 检查豁免，待未来插件认领
# - map / save 第 0 步必读本表（一次读取锚点：字段与值集在写入前可见，不扫描全库）
# - 字段叠层组合：一个页面 = 协议字段 + 各插件字段（如 source 页 = 协议 + vault + tag）
# - actor 约定（一切署名字段的统一值格式）：human:名字（如 human:Joss）/ process:流程名（如 process:hash-recalc）/ agent/模型标识（如 agent/GLM-5.3）
# - 旧值迁移映射：seed→draft、developing→draft、done→stable

protocol:
  type:
    values: [source, session, profile, todo, structure, language, lark, calendar, project, email, bb, tmp]
    note: 领地值封闭（扩值须修订本表）——决定页面归属与机械检查：source=代理页、session=sessions 领地、profile=画像页、todo=临时记忆页、structure=结构声明页、language=行文声明页（wiki/language.md，`language`/`terms` 块映射，归 language 插件）、lark=外部指针页（wiki/lark/ 领地，token 即身份证明，归 lark 插件族）、calendar=时间领地页（月页，两节制）、project=项目声明页（wiki/projects.md，`projects` 块映射；项目本体在根容器 projects/）、email=个人邮箱域页（wiki/email/ 领地——速写/人档/线程档/源档，token = 邮箱地址或 Message-ID，归 email 插件）、bb=BB 课程域页（wiki/bb/ 领地——域根速写与课程身份页，term_id/course_id 即身份证明，归 bb 插件）、tmp=临时页（路径即领地，派生层隐身）；导入/互操作消费侧容忍未知 type
    defaults: [concept, qa, decision, entity, comparison]
    defaults_note: 形态默认词表——notes 领地内的知识形态，无机械语义；实例开放自扩（不须修订本表），优先复用防词表碎片
  status:
    values: [draft, stable, deprecated]
    note: 生命周期三值；deprecated = 为链接与历史保留、但已非当前
  title:
    note: 页面标题，字符串，建议必填
  description:
    note: 一句话描述（≤80 字）；索引条目与 viewer 提示的数据源，缺失时索引取正文首句
  created:
    note: YYYY-MM-DD
  updated:
    note: YYYY-MM-DD，任何写操作刷新

plugins:
  bb:
    bb:
      note: 块映射（课程身份页）——term_id（学期 machine id，如 _426_1）/ course_id（课程 machine id，如 _18030_1）/ term_status（现役|冻结——自 inbox terms 推导落页，消除单点依赖）；与属地目录一比一，即身份证明
    terms:
      note: 块映射（域根速写页）——term 目录名 → 一句话（现役/冻结标记 + term_id）；现役学期即拉取与速写的默认作用域
  bb-map:
    assessment:
      note: 块映射（assessments 聚合页机械区）——due（截止）/ submitted_at（提交时刻）/ score 与 possible（得分/满分）/ status（Graded|NeedsGrading|None）/ column_id 与 attempt_id（成绩册列与提交记录 id，对账锚点）——API 快照字段
    raw:
      note: 块映射（assessments 聚合页多源对账）——角色 → bb/ 相对路径（要求/参考/提交，开放词表），聚合页与 bb/ 文件群的对应关系；允许多页引用同一文件（共享要求文件为正常形态）
    raw_file:
      note: 标量（attachments 1:1 代理页）——根相对路径，指向 bb/ 原件（词形语义同 mapping）
    raw_path:
      note: 标量（courseware 知识点页）——根相对路径，指向 bb/ 内容单元（文件或目录）；路径即出身证明；完全未下载单元可缺省（清单标注未下载即构成记录）
    raw_sha256:
      note: 标量（attachments 1:1 代理页）——十六进制 SHA-256，可从 bb/ 机械重算
  bb-quiz:
    quiz:
      note: 块映射（考卷页）——course（课程代码）/ scope（出题范围）/ difficulty_median（难度中值 1-5，认知层级）/ types（题型列表，开放词表）/ source（样例 sample|作业 assignment|习惯 habit）/ answer_of（答案页回链试题文件名）
  bb-track:
    form:
      note: 标量（bb 侧笔记文件可选）——text|image|mixed 形态
    origin:
      note: 标量（bb 侧笔记文件可选）——human|ai 创作出身；ai 为弱证据，人复核升权
    stage:
      note: 标量（bb 侧笔记文件可选）——snapshot|mature|summary 阶段（临时快照/成熟沉淀/总结集合）；标记属人，变更是认知信号
  calendar:
    calendar:
      note: 块映射（声明页）——源键 → 源声明（值语法归适配器：lark-calendar 用 `lark/<profile> <calendar_id|primary>`）；源键即日程行尾标
  email:
    email:
      note: 块映射——account（所属账户，= 所在目录名）/ kind（页形态：account 身份页 / thread 线程档 / source 源档 / person 人档，开放词表）/ token（身份证明：人档 = 邮箱地址、单件 = Message-ID 一比一、线程档 = members 列表）/ url（webmail 或 message:// 深链）
  language:
    language:
      note: 块映射（声明页）——规范键 → 一句话规则（开放词表，如 default/proper-noun/code），产出语言与行文基线
    terms:
      note: 块映射（声明页）——术语原文 → 统一译名（单行值），跨 session 译名一致性查询件
  lark:
    lark:
      note: 块映射——profile（所属企业身份，= 所在目录名）/ kind（页形态：profile 身份页、docs 域枢纽、docx|wiki|sheet|base|file… 对象类型，开放词表归域插件约束）/ token（对象 token，身份证明，页↔token 一比一）/ url（lark 侧地址）
  lark-docs:
    docs:
      note: 块映射（docs.md 枢纽）——关心区名 → 范围一句话（知识空间名 / 云盘目录 / 特定对象，agent 经 lark-cli 解析）；关心区 = 指针页目录段
  lark-im:
    chat_id:
      note: 标量（人档）——p2p 单聊 chat_id 锚（拉消息入口，无单聊缺省）
    department:
      note: 标量（人档）——部门，contact 解析填充
    im:
      note: 块映射（im.md 枢纽）——策略键 → 一句话：群同步 / 涌现 / 关注 / 排除等人档涌现与同步范围声明
    key_members:
      note: YAML 列表（群档）——关键人 wikilink（群主必在，余为已建档者）；不存全员名单
    position:
      note: 标量（人档）——职位，contact 解析填充
  link:
    aliases:
      note: YAML 列表，别名/短名，供链接解析
    related:
      note: YAML 列表，相关页全名 wikilink
  mapping:
    raw_file:
      note: 根相对路径，代理页必有
    raw_sha256:
      note: 十六进制 SHA-256，可从 vault 机械重算
  project:
    projects:
      note: 块映射（声明页）——项目名 → 一句话定位；键应与 projects/ 下目录一一对应（双向 diff）
  sessions:
    participants:
      note: YAML 列表，actor 约定（human:名字 / process:流程名 / agent/模型标识），多 agent 协作扩展点
  tag:
    tags:
      note: YAML 列表 ≤5；中文为主，英文 kebab-case；层级 父/子 ≤2；禁复述 type
  trust:
    generated:
      note: 块式映射 by/at（actor 约定 + YYYY-MM-DD），页面由谁生成
    sources:
      note: 来源列表，项含 id / resource / 可信度信号（author、usage_count、last_modified）
    stale_after:
      note: YYYY-MM-DD 绝对时刻；过期判定 = now ≥ stale_after 的纯比较
    verified:
      note: 事件列表，项单行 `by: <actor>, at: <日期>`，可多次追加；信任层级由此推导
  vault:
    url:
      note: 来源 URL；URL 型资产的出处登记（来源保全），人工放入可选、agent 通道（delegate 等）必填；兼作他域借道 vault 落地的接口

reserved: {}

