id: email
version: 0.4
depends:
  - domain
  - wiki
  - trust
  - log
  - cron
updated: 2026-10-06
attachment:
  - "wiki/email/ — personal mailbox domain territory (domain root: the unified digest and global person archives; one directory per account, directory name = connector profile name)"
  - "wiki/email/inbox.md — unified inbox digest (cross-account distillation, lines tagged with the account, whole page regenerable, short TTL)"
  - "wiki/email/people/ — person archives (token = email address, global scope, one page per person across accounts)"
  - "wiki/email/<account>/account.md — account identity page (address/protocol/pull window/TTL override/emergence conditions/areas-of-interest declaration/alias claiming)"
  - "wiki/email/<account>/threads/ — thread archives (the References chain within an account: mechanical section Message-ID members + accumulation section/snapshot section)"
  - "wiki/email/<account>/sources/ — source archives (subscriptions bound to a receiving address, the governance unit)"
fields:
  email: "block mapping — account (owning account, = the containing directory name) / kind (page form: account identity page / thread thread archive / source source archive / person person archive, open vocabulary) / token (identity proof: person archive = email address, single item = Message-ID one-to-one, thread archive = members list) / url (webmail or message:// deep link)"
inject: "Personal mailbox domain `wiki/email/` (one directory per account, agent calls must always name the account): domain root unified digest `inbox.md` (recent-window distillation, lines tagged with the account, whole page regenerable, short TTL) + global person archives `people/` (token = email address, one page per person across accounts — the token's scope decides the home; aliases collect multiple addresses of the same person, the body's relationship with me append-only converging); account directories — identity page `account.md` (address/protocol/pull window/TTL override/emergence conditions/areas-of-interest declaration), thread archives `threads/` (mechanical section Message-ID member list + accumulation section topic conclusions append-only, snapshot section may hold full text as a cold source), source archives `sources/` (subscription governance: type/cadence/reading signals/handling policy); full mapping forbidden — retrieval is pull-and-discard, only repeated hits earn an archive (emergence-based); one-way derivation out-only — action items→todo, invitations→calendar, attachments→vault materialization, high-value→notes (backlinking the thread archive); the agent reads the mailbox only (PEEK without marking read, no moving no deleting), send-type operations always require explicit user request; resources gone → mark status: deprecated, never delete; trust ceiling machine-confirmed, stale_after = pull date + TTL (default 1 day, overridable on the identity page), the agent is the synchronizer"
usage:
  - Connection discipline: --account always carried (directory name = connector profile name); auth checked live, never written to disk; entering the domain reads the account identity page first — pull scope (folders/time window/priority sources) per the areas-of-interest declaration
  - Digest refresh (mechanical): pull the recent window per account → distill and rewrite `wiki/email/inbox.md` (categories + todo markers + key-source movements, lines tagged with the account, account quotas on the identity pages) → verify + log line (type other)
  - Retrieval pull-and-discard: finding a mail searches the server per account, presentation ends it; repeatedly searching the same topic across accounts = the emergence signal for a thread archive
  - Archiving (emergence-based, thresholds on the account identity page): person archive (token = address, global at the domain root), source archive (token = sender address × account), thread archive (default naming YYYY-MM-DD-<topic>)
  - Thread archive maintenance: fresh pulls append new rounds (References chain, breaks clustered by topic + participants as fallback, noted in the mechanical section); accumulation section `## date topic→result` append-only; snapshot section `## Snapshot YYYY-MM-DD` may hold full text for important long mails (cold source immutable, low staleness risk)
  - One-way derivation (out-only): action items → todo; invitations/confirmations → calendar month-page schedule lines (source key = email/<account>); attachments → vault materialization then map proxy; high-value conclusions → save promotes to notes with backlink — the todo/calendar/notes bridges, format details owned by each bridge
  - Read-only discipline: PEEK without implicitly marking read, no moving, no archiving, no deleting — the mailbox's original state belongs to the human; drafting is allowed (automatically carrying thread-archive context), sending/forwarding/moving/deleting always require explicit user request
  - Daily refresh (optional, unattended): via the cron bridge register a task page (form: session, domain: email) refreshing the digest per account + action-item reminders — replay recipe in the cron plugin; failing accounts report to the log without blocking other accounts
checks:
  - Semantic items (v0.1 manual, attached audit deferred): a type: email page outside `wiki/email/` → error; duplicate person-archive token (address) → error; a thread archive's mechanical section missing members (Message-ID list) → warning; manual-edit traces on the digest → warning; stale list (info level: pull date + TTL)
