id: language
version: 0.3
depends:
  - wiki
updated: 2026-10-07
attachment:
  - "wiki/language.md — the writing declaration page (output-language and writing-baseline ontology: frontmatter language/terms block mappings + body distillation section)"
  - "scripts/check.py — attached audit (territory placement / terms empty values / declaration page presence)"
fields:
  language: block mapping (declaration page) — canonical key → one-sentence rule (open vocabulary, e.g. default/teaching/annotation/register); output language and writing baseline — register = the writing register (audience reading level, default first/second-year undergraduates), consumed by bb-teach and bb-quiz
  terms: block mapping (declaration page) — term original → unified translation (single-line value); the cross-session translation-consistency lookup piece
usage_routes:
  - save
inject: "Writing declaration page `wiki/language.md` (type: language): output language and writing baseline — frontmatter `language` block mapping = canonical key → one-sentence rule (open vocabulary; domain-plugin consumed-key precedents: teaching for lectures (bb-teach), annotation for solutions (bb-quiz), register for the writing register (audience reading level, default first/second-year undergraduates)) + `terms` block mapping = term original → unified translation; the body distills translation notes (append-only); the agent reads this page before producing any written artifact; page or key absent = follow the session language (produce in whatever language the conversation uses; proper nouns, code, paths, commands, and file names always keep their original form — the language-neutrality discipline); the framework presets no specific language, and the register likewise defaults to the first/second-year undergraduate reading level (AGENTS principle 12) — this page is a default baseline, not a mandate — the domain plugins' source-alignment discipline (e.g. exam language follows course materials) takes precedence; emergence-based term registry — a term absent from the table is annotated with its original on first occurrence and registered only after recurring hits; direct human edits are legitimate"
usage:
  - When to read: read the declaration page before writing any artifact (wiki pages, documents, lecture distillates); page or key absent = follow the session language (conversation language is the output language); proper nouns, code, paths, commands, and file names always keep their original form (language neutrality, invariant under configuration) — the framework presets no specific language; Chinese is merely an instance fact of this project's development period (AGENTS principle 7)
  - Register discipline: the `register` key governs the writing register (audience reading level) — the program default is first/second-year undergraduates (AGENTS principle 12), and bb-teach (teaching) and bb-quiz (annotation) read it; key absent → program default; a default baseline, not a mandate
  - Term discipline: when writing hits a term, consult the `terms` mapping first — if tabled, follow the table; otherwise annotate the original in parentheses on first occurrence (e.g. '检索增强生成 (RAG)'), registering only after recurring hits (emergence-based); a registered entry = a single line original→translation, long notes (translation rationale, usage examples) go to the body distillation section
  - Layering: a default baseline, not a mandate — the domain plugins' source-alignment discipline (exam language follows samples/course materials) takes precedence over this page; tag word forms belong to tag, forms of address and personal dynamic preferences belong to user-profile, in-domain term tables (the bb courseware glossary) are self-managed within the domain — none of these are restated on this page
  - Maintenance: the `language` mapping is human-defined first, the agent may propose; the `terms` mapping may be registered by the agent but never overwrites human-defined entries (objections reported); the body distillation section is append-only
checks:
  - Mechanical (attached-audit script `scripts/check.py`, executed discovery-style by audit): type: language landing outside `wiki/language.md` → error; terms empty values → warning; declaration page absent → info (session-language fallback tolerated)
