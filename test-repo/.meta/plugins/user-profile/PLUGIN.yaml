id: user-profile
version: 0.4
bridge: 按需
depends:
  - wiki
  - trust
  - sessions
updated: 2026-10-02
attachment:
  - "wiki/profile.md —— 用户画像页（对使用者的持续认知档案）"
fields: {}
commands:
  - profile
inject: "用户画像 `wiki/profile.md`（type: profile）：对使用者的持续认知档案，静态身份层 + 动态偏好层，维度不枚举；收敛式更新——新值取代旧值、正文留痕；断言必带证据 wikilink（wiki 内页面皆可：会话页、vault 代理页、lark 档案页），偏好层挂 stale_after；零自有字段复用 trust，不属 notes 领地，不打 tags（单页直接读取，不入词表检索）；更新走 profile 命令——双轨触发（用户明示 / agent 识别显著信号自发调用），首次触发即自建页面；个性化决策（称呼、风格、偏好）前先读此页；认知桥（按需，宪法准则 11）——域认知页经画像正文 `## 域认知` 节登记（行 = 域名 + 路径形 wikilink，如 bb-track user.md），画像只聚合指针不复制域状态，个性化输出前读画像及其登记认知页；桥只持「谁在、去哪读」，认知页形态归域插件"
usage:
  - 触发双轨：用户明示 profile；agent 在任意会话识别显著信号后自发调用——信号沉淀统一走本命令，不寄生其他命令流程
  - 信号判据：自述信号（偏好表达、纠正、背景）与行为信号（题材、领域、素材习惯）；只记反复出现的题材/领域、显式偏好表达、对输出的纠正、稳定的背景事实（身份/工具/环境）；一次性、工具性内容与不确定的观察不记
  - 证据域：wiki 内页面皆可（会话页、vault 代理页、lark 档案页、notes）——引用即 wikilink，跨域不立依赖
  - 分层落点：不变的身份事实入静态层；会漂移的兴趣与习惯入动态层并挂 stale_after（随观察续期）
  - 断言 = 一行具体可证的主张 + 行内证据 wikilink（「偏好中文简洁回复」优于「喜欢简洁」）；单条增量断言不直接升格为偏好，偏好为页内聚合出的模式
  - 收敛式更新：新值取代旧值时正文留痕（单行：谁何时改了什么）；整页重写仅限画像建构/整合（呈预览等确认）
  - 首建：首次触发即自建页面（frontmatter：type: profile + generated，动态层挂 stale_after），不依赖初始化机制
  - 日记类资产只记元信号（有无、节奏），内容不进画像（豁免随 mapping）
  - 隐私红线：画像内容是实例数据，不入框架仓库与 test-repo
  - 认知桥注册（域件侧动作，披露于本侧）：域认知插件建档时若画像在场，维护画像 `## 域认知` 节一行（域名 + 路径形 wikilink）；画像缺席跳过不代建（按需桥缺席容错）；多课多档登记路径形通配（bb：<term>/<course> 形）
checks:
  - 语义（check 命令）：画像断言缺证据 wikilink → warning
  - 机械项：type: profile 页面落 `wiki/notes/` 或 `wiki/vault/`（走错领地）→ error
  - 机械项（信息级）：画像页缺失（未触发常态，profile 首建随触发）
