id: index
version: 0.12
depends:
  - tag
  - wiki
updated: 2026-10-06
attachment:
  - "wiki/index.md — root index (always present; carries format_version; directly lists reachable pages)"
  - "Per-directory index.md — born of the overflow-offloading scheme (split out when a list overflows the window, disappearing on rebuild once merged back into the parent)"
  - "wiki/tags.md — tag reverse index"
fields: {}
inject: "Index overflow-offloading scheme: the root `wiki/index.md` is always present (carries format_version — the page-format contract version, bumped on incompatible changes), directly listing all reachable pages (this directory + un-split subtrees, full-path wikilinks); when some index list overflows the window (≤25 entries, parameters per the pipeline source code), subtrees are split out in descending page-count order into their own `index.md` (entry line carrying the page count) — small repositories usually keep a single index, the disclosure boundary emerges with content quality; `wiki/tags.md` (tag reverse index) unchanged; aggregate only, never hand-edited, pure-function rebuild, indexes do not invent structure (a level's flat list overflowing the window is listed in full as-is; the cure is subdirectories, not index changes); rebuild via `pipeline.py index`, the second retrieval entry"
usage:
  - Post-write rebuild (mechanical, automatic): `python .meta/scripts/pipeline.py index` (index — overflow-offloading scheme, including deletion of obsolete old indexes after merge-back) and the same script's `tags` (tag reverse index); LLMs never hand-write indexes
checks:
  - Deviation between indexes and the actual page set (including merged-back indexes pending deletion) → fixed by running `pipeline.py index` to rebuild (idempotent; no diff means consistent); same for tags (`pipeline.py tags`)
  - Traces of hand editing → warning
