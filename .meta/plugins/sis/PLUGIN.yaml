attachment:
  - "wiki/cuhksz/sis/ —— 学籍制度属地：inbox.md（学籍速写页，整页可再生短 TTL，**缺席即建**）；详情页涌现制不预立"
fields:
  sis_inbox: "块映射（速写页可选）——term（现役学期名）/ ttl（TTL 覆写，天）；缺席跟默认"
inject: "学籍制度子域 `wiki/cuhksz/sis/`（外源 sis.cuhk.edu.cn，Oracle PeopleSoft CS，连接器 sis-cli 纯只读，用法与命令面见 connectors/sis-cli/SKILL.md）：速写页 inbox.md（近窗蒸馏——本学期课表概要/注册窗口/holds/最新成绩快照，行标学期，整页可再生短 TTL 默认 1 天，**缺席即建**）；**查询即答不默认投影**——成绩/历史/课表/考试现拉即答（term 交互与只读红线见 sis-cli skill），高价值结论涌现入 notes 回链；单向派生只出不回：注册窗口临期 → todo、课表/考试安排 → calendar 日程行（补 bb 挂缺的课表源）、学期成绩（终态事实）→ bb-track 证据流（域内直引免桥，经用户确认）；个人官方 PDF（在读证明/非官方成绩单）经用户明示下载走 vault 物化 + 本域页面 wikilink；官方成绩单申请等写操作**永不入本域**（真实学籍后果）；trust 天花板 machine-confirmed，stale_after = 拉取日 + TTL（日期粒度），agent 即同步器"
usage:
  - 进域先读 wiki/cuhksz/sis/inbox.md（缺席即建：sis-cli grades/appt/schedule 现拉蒸馏重写速写 + log 行）；stale 同此（agent 即同步器）
  - 查询经 sis-cli skill：成绩（--term 学期子串）/ 历史 / 课表（--days 星期归属）/ 注册窗口 / 考试安排；会话分钟级短寿、命令自动重登，无需手动 login（凭据经环境变量或 ~/.sis-cli/）
  - 学期成绩沉淀：学期结束后 grades --term 全量拉取 → 速写页快照节 + bb-track 证据流追加（经用户确认，machine 证据）
  - 学籍身份变更（转专业/毕业）→ 更新域根 identity.md 的 sis 块映射
checks:
  - 语义项（v0.1 人工，附检后置）：type: sis 页落 wiki/cuhksz/sis/ 之外 → error；速写页手编痕迹 → warning；stale 清单（信息级）
