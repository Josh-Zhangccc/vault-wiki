id: device
version: 0.2
depends:
  - wiki
updated: 2026-10-04
attachment:
  - "wiki/notes/ —— 设备档案页住所（一设备一页，type: entity 建议，device 块映射登序列号/购入/保修）"
  - "scripts/check.py —— 附检（warranty_until 临期 30 天 / 已过期 → warning 清单）"
fields:
  device: 块映射（notes 设备档案页）——serial（序列号）/ purchased（购入 YYYY-MM-DD）/ warranty_until（保修或保障类截止 YYYY-MM-DD，附检扫描项）三键最小集，余键开放（model、vendor 等，架构不枚举）
inject: "设备档案：个人设备一设备一页落 `wiki/notes/`（type: entity 形态建议，页名自由、同名尾缀消歧），frontmatter `device` 块映射登 serial / purchased / warranty_until（最小键集，余开放：model、vendor 等），正文 `## 工具环境` 摘要节记连接器/运行时/通道在场级信息（跨设备互查，装卸软件时同步；全量软件清单不记——现查即得）；发票照片类资产走 vault 物化、页面 wikilink 关联（跨件引用不立依赖）；trust 可选挂——人手登记即 human 证据、静态事实不挂 stale_after；到期提醒——附检扫 warranty_until，30 天内临期或已过期呈 warning 清单，经用户确认受托追加 todo 行（受托即追加，不自动写）；实时状态监控与团队借还不做（范围边界）"
usage:
  - 登记：对话内自然语言编辑即可（无命令）——一设备一页落 `wiki/notes/`，type: entity（形态建议），页名自由、同名尾缀消歧；`device` 块映射最小键 serial / purchased / warranty_until，余键开放
  - 工具环境：设备页正文 `## 工具环境` 摘要节——记连接器在场（lark-cli、bb-cli 等）、运行时（python、node）、通道（ssh、web 入口）与设备用途定位；只记在场级、不记精确版本（现查）；装卸软件时同步本节；全量软件清单不记；本节是跨设备互查的注册表——AGENTS 外壳只及本机，设备页覆盖全部相关设备，外壳以指针引到设备页
  - 资产关联：发票、照片、截图类资产 vault 物化后以 wikilink 关联设备页；跨件引用不立依赖
  - 信任：可选挂 trust——人手登记天然含 human 证据；静态事实不挂 stale_after（非拉取物、无 TTL 语义）；工具环境节在场级粒度、同样不挂
  - 到期处置：附检呈临期清单（warranty_until 30 天内或已过期）→ 会话呈报 → 用户确认后受托追加 todo 行（触发条件 = 到期日 + 一句话 + by/at）；不自动写入
  - 检索：走 query 常规通道，notes 领地规则全盘适用（tags 正常打、只增）
checks:
  - 机械项（附检脚本 `scripts/check.py`，audit 发现式执行）：device 块映射的 warranty_until 距今 ≤30 天 → warning 临期；已过期 → warning 过期；日期非法 → warning
