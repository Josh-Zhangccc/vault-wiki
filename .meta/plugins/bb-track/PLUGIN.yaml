id: bb-track
version: 0.1
depends:
  - bb
  - bb-map
  - trust
  - wiki
updated: 2026-10-02
attachment:
  - "wiki/bb/<term>/<course>/user.md —— 认知档案（课程根，不入四桶；两区制：认知读数收敛覆写 + 证据流只增）"
  - "bb/<term>/<course>/notes/ —— 人的笔记区（bb v0.4 立设，本插件只读消费其 frontmatter 属性）"
fields:
  origin: "标量（bb 侧笔记文件可选）——human|ai 创作出身；ai 为弱证据，人复核升权"
  form: "标量（bb 侧笔记文件可选）——text|image|mixed 形态"
  stage: "标量（bb 侧笔记文件可选）——snapshot|mature|summary 阶段（临时快照/成熟沉淀/总结集合）；标记属人，变更是认知信号"
inject: "bb 认知档案：每课课程根 user.md（属地域内原生页首例，wiki v0.7 两形）——`## 认知读数` 收敛覆写（锚 courseware sm-N，粗粒度自陈合法，状态词开放；含目标层：课程目标 + 短期优先带时效）+ `## 证据流` 只增（日期+出处+断言+回链）；信号权重 human>machine>ai 笔记（弱证据，人复核升权）；应知不存（差距现算）、错题题级归 assessments 复盘、统计现算；更新双轨（agent 显著信号自发/用户明示），建档懒惰式；学期即边界随 term_status 冻结；trust 天花板 machine-confirmed（含 human 证据升 human-reviewed），stale_after 默认 14 天可覆写；笔记区 notes/ 只读，可选属性 origin/form/stage（stage 标记属人）"
usage:
  - "建档：首个显著信号或用户明示时建 user.md（type: bb + generated/updated/stale_after）；缺席即无认知数据，消费侧降级处理不报错"
  - "追加证据：`- MM-DD 出处（human 对话|machine grades|human 笔记|ai 笔记|human 复核）：断言 → [[回链]]`；出处开放词表"
  - "收敛读数：新证据到 → 读数行改写（新值取代旧值，行内留最近证据摘要与日期）；证据流不动"
  - "消费纪律：teaching/testing/复盘类输出前先读 user.md；stale 先核对近窗证据或询问；差距分析 = courseware 知识点全集 − 已锚点集，现算"
  - "笔记消费：读 notes/ 概览与 stage/origin 属性作信号；不改不删不代标 stage；ai 笔记仅弱证据"
  - "写后管道：verify；log 行（类型 profile）"
checks:
  - "语义项（v0.1 人工，附检后置）：user.md 落课程根之外或四桶内 → error；证据流条目被改写删除 → error；读数条目无可溯证据 → warning；读数仅凭 origin: ai 无复核 → warning；stale 超窗后消费未核对 → info；笔记属性值出开放词表 → info"
