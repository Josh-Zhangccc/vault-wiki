id: sessions
version: 0.8
depends: []
updated: 2026-09-13
attachment:
  - "wiki/sessions/ —— 原生会话区，session 型骨干页"
fields:
  participants: "YAML 列表，actor 约定（human:名字 / process:流程名 / agent/模型标识），多 agent 协作扩展点"
commands:
  - save
inject: "原生会话 `wiki/sessions/`：会话骨干页（type: session，participants 必填=actor 列表，默认命名 YYYY-MM-DD-<主题>）；高价值主题提升为 `wiki/notes/` 独立页并回链；不可再生区，命令只增不改"
usage:
  - 落点 `wiki/sessions/YYYY-MM-DD-<主题>.md`（默认命名），type: session，participants 必填（actor 列表）
  - 骨干页五节形状：核心结论 / 决策与理由 / 非显然洞见 / 开放问题 / 相关页（全形状样例见 `.meta/plugins/sessions/PLUGIN.md` Example 节）
  - 独立高价值主题提升为 `wiki/notes/` 页，骨干页留 wikilink；提升前先去重
checks:
  - 机械项（audit 覆盖）：session 型页面在 `wiki/sessions/` 之外（或反向）→ warning；participants 缺失或项不符 actor 约定 → warning
  - 语义：骨干页过度膨胀（该提升未提升）→ warning
