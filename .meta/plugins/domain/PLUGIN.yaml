inject: "域抽象（外）：wiki 只认内外；外域 = 一份适配器契约（外领地 / 落地策略 / 身份证明 / wiki 侧属地 / 写模型 / 信任模型），各域插件自行声明、域内插件经传递属域；落地本质是写模型选择（终态资产→只增仓储、过程容器→全权读写、真相在别处→指针），投影密度随翻译成本（镜像 / 指针 / 仅披露）；借 vault 或指针为默认姿态，自立容器是例外（判据：写模型或结构刚性分叉）；域须在 wiki 内可发现（声明页或注入行）"
