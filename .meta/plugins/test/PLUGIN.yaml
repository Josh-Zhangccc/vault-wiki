# 插件注册清单（manifest）——插件的唯一注册事实源
# 字段规范由协议文档定义（.meta/docs/，待立稿）；本文件兼任规范示例。

type: plugin
id: test                      # ASCII、稳定、全局唯一，即目录名
name: 插件自检（规范示例）       # 人读名
version: 0.1                  # 单调可比较即可；破坏性变更升主版本
class: bearing                # bearing=承重件（拔了健康检查会响）/ normal=非承重件
scopes: []                    # 写权限域声明；本插件只读不写。可用域（协议定稿为准）：
                              # vault-append / wiki-proxy-write / wiki-curated-write / wiki-index-write / meta-write
depends: []                   # 依赖的插件 id：只能向下（协议→承重→工位→个性化），禁同层、禁环
status: draft                 # draft / stable / deprecated
updated: 2026-09-07
entry:
  doc: PLUGIN.md              # 逻辑本体（插件目录内相对路径，必填）
  scripts: [scripts/check.py] # 可选工具
