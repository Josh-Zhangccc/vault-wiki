updated: 2026-10-06
attachment:
  - "wiki/email/ —— 个人邮箱域属地（域根：统一速写与全局人档；一账户一目录，目录名 = 连接器 profile 名）"
  - "wiki/email/inbox.md —— 统一收件箱速写（跨账户蒸馏、行标账户、整页可再生、短 TTL）"
  - "wiki/email/people/ —— 人档（token = 邮箱地址，全局作用域，跨账户一人一页）"
  - "wiki/email/<账户>/account.md —— 账户身份页（地址/协议/拉取窗口/TTL 覆写/涌现条件/关心区声明/别名认领）"
  - "wiki/email/<账户>/threads/ —— 线程档（账户内 References 链：机械区 Message-ID 成员 + 沉淀区/快照节）"
  - "wiki/email/<账户>/sources/ —— 源档（订阅绑定收件地址，治理单位）"
fields:
  email: "块映射——account（所属账户，= 所在目录名）/ kind（页形态：account 身份页 / thread 线程档 / source 源档 / person 人档，开放词表）/ token（身份证明：人档 = 邮箱地址、单件 = Message-ID 一比一、线程档 = members 列表）/ url（webmail 或 message:// 深链）"
inject: "个人邮箱域 `wiki/email/`（一账户一目录，agent 调用必带账户）：域根统一速写 `inbox.md`（近窗蒸馏、行标账户、整页可再生、短 TTL）+ 全局人档 `people/`（token = 邮箱地址，跨账户一人一页——token 作用域决定家；aliases 收多地址同人，正文与我的关系只增收敛）；账户目录——身份页 `account.md`（地址/协议/拉取窗口/TTL 覆写/涌现条件/关心区声明）、线程档 `threads/`（机械区 Message-ID 成员列表 + 沉淀区议题结论只增，快照节冷源可全文）、源档 `sources/`（订阅治理：类型/节奏/阅读信号/处置策略）；全量映射禁止——检索现拉即弃，反复命中才立档（涌现制）；单向派生只出不回——行动项→todo、邀请→calendar、附件→vault 物化、高价值→notes（回链线程档）；agent 对邮箱只读（PEEK 不标已读、不移动不删除），发送类操作永远须用户明示；资源消失标 status: deprecated 不删；trust 天花板 machine-confirmed，stale_after = 拉取日 + TTL（默认 1 天，身份页覆写），agent 即同步器"
usage:
  - 连接纪律：--account 必带（目录名 = 连接器 profile 名）；auth 现查不落盘；入域先读账户身份页——拉取范围（文件夹/时间窗/优先源）以关心区声明为准
  - 速写刷新（机械）：逐账户拉近窗 → 蒸馏重写 `wiki/email/inbox.md`（分类 + 待办标记 + 关键源动态，行标账户，账户配额见身份页）→ verify + log 行（类型 other）
  - 检索现拉即弃：找邮件逐账户服务端检索、呈现即止；反复跨账户找同一主题 = 立线程档的涌现信号
  - 立档（涌现制，阈值在账户身份页）：人档（token = 地址，域根全局）、源档（token = 发件地址 × 账户）、线程档（默认命名 YYYY-MM-DD-<主题>）
  - 线程档维护：现拉补新轮次（References 链，断裂按主题+参与人兜底聚类并在机械区注明）；沉淀区 `## 日期 议题→结果` 只增；快照节 `## 快照 YYYY-MM-DD` 重要长邮件可全文（冷源不可变，过时风险低）
  - 单向派生（只出不回）：行动项 → todo；邀请/确认 → calendar 月页日程（源键 = email/<账户>）；附件 → vault 物化后走 map 代理；高价值结论 → save 提升 notes 并回链——todo/calendar/notes 桥，格式细则归桥
  - 只读纪律：PEEK 不隐式标已读、不移动不归档不删除——邮箱原状属于人；起草可以（自动带线程档案上下文），发出/转发/移动/删除永远须用户明示
  - 日更（可选，无人值守）：经 cron 桥登记任务页（form: session，domain: email）逐账户刷速写 + 行动项提醒——重放配方见 cron 插件；失败账户报 log 不阻断他账户
checks:
  - 语义项（v0.1 人工，附检后置）：type: email 页落 `wiki/email/` 之外 → error；人档 token（地址）重复 → error；线程档机械区缺 members（Message-ID 列表）→ warning；速写手编痕迹 → warning；stale 清单（信息级：拉取日 + TTL）
