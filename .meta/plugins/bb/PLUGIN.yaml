attachment:
  - "bb/ —— BB 拉取物仓储（root 容器，与 vault/projects 平级；<term>/<course>/ 结构，只增，删改自由属于人）"
  - "wiki/bb/ —— BB 域属地（<term>/<course>/，目录名 = 学期名/课程代码，如 2610UG/AIE3005）"
  - "wiki/bb/inbox.md —— 域根速写页（公告蒸馏 + 临近截止 + 未交提醒，行标课程，整页可再生短 TTL；frontmatter 兼域配置）"
fields:
  bb: "块映射（课程身份页）——term_id（学期 machine id，如 _426_1）/ course_id（课程 machine id，如 _18030_1）；与属地目录一比一，即身份证明"
  terms: "块映射（域根速写页）——term 目录名 → 一句话（现役/冻结标记 + term_id）；现役学期即拉取与速写的默认作用域"
inject: "BB 课程域 `wiki/bb/`（外领地 bb.cuhk.edu.cn，连接器 bb-cli 纯只读，用法与位置见 bbcli skill）：双侧同构 `<term>/<course>/`——外 `bb/` 拉取物仓储（课件全量物化 + 提交件 submissions/，只增、删改自由属于人、存储是唯一成本），内 `wiki/bb/` 属地，目录名 = 学期名/课程代码（如 2610UG/AIE3005），machine id 落身份页 bb 块映射（term_id/course_id）作一比一身份证明，同期同代码尾缀消歧、停用标 status: deprecated 不删；域根速写页 inbox.md（近窗公告蒸馏 + 临近截止 + 未交提醒，行标课程，整页可再生短 TTL；frontmatter 兼域配置——terms 块映射现役学期与冻结标记）；课件物化后即本地终态资产豁免 TTL；投影细则归 bb_map 后议；凭据会话只存本机不入库；课程/成绩/提交数据属实例数据不入框架仓库；trust 天花板 machine-confirmed，stale_after = 拉取日 + TTL（默认 1 天，速写页覆写），agent 即同步器"
usage:
  - 进域先读 wiki/bb/inbox.md（速写与域配置一体）；stale 即经 bbcli 现拉刷新（agent 即同步器），毕写 log 行（类型 other）
  - 拉取落位：课件 → bb/<term>/<course>/（保留源侧目录树）；提交件 → bb/<term>/<course>/submissions/；拉取物只增不覆写，同名新文件尾缀
  - 新学期/新课 = 建属地目录 + 身份页（bb 块映射 term_id/course_id）；bbcli 解析直接用目录名（--term 学期名、课程代码子串）
  - 单向派生（只出不回）：行动项 → todo；课业日程 → calendar；高价值结论 → notes（回链属地页）
  - 隐私与边界：成绩按需现拉呈现即止、不默认投影；roster 不拉；提交作业等写操作不入本域
checks:
  - 语义项（v0.1 人工，附检后置）：type: bb 页落 wiki/bb/ 之外 → error；身份页 bb 块映射缺 course_id 或与目录不对应 → error；速写页手编痕迹 → warning；stale 清单（信息级）
