inject: "课程运行子域（cuhksz 域内）`wiki/cuhksz/bb/`（外领地 bb.cuhk.edu.cn，连接器 bb-cli 纯只读，用法与位置见 bbcli skill）：双侧同构 `<term>/<course>/`——外 `cuhksz/bb/` 课程工作区（机器拉取物：文档类全量物化、媒体类默认指针化、提交件 submissions/，只增；笔记保留子区 notes/——学习笔记住所，人为主、ai 产物共居（teach 讲解沉淀 ai 笔记平铺带 origin: ai、quiz 考卷住 testing/ 子区；ai 产物只增不覆写；删改自由属于人，fetch/对账/映射永不触碰人的笔记、读取合法）），内 `wiki/cuhksz/bb/` 属地，目录名 = 学期名/课程代码（如 2610UG/AIE3005），machine id 与学期状态落身份页 bb 块映射（term_id/course_id/term_status）作一比一身份证明，同期同代码尾缀消歧、停用标 status: deprecated 不删；域根速写页 inbox.md（近窗公告蒸馏 + 临近截止 + 未交提醒双源——作业无提交 ∪ 成绩册有 due 无 attempt，行标课程，整页可再生短 TTL，**缺席即建**；frontmatter 兼域配置——terms 块映射现役学期与冻结标记）；公告拆信不存档（作业变更→assessments、考试/政策/分组→info、行动项→todo、资源发布→fetch 即弃，原文现拉即得）；课件物化后即本地终态资产豁免 TTL；投影细则见 bb-map 插件；凭据会话只存本机不入库；课程/成绩/提交数据属实例数据不入框架仓库；trust 天花板 machine-confirmed，stale_after = 拉取日 + TTL（默认 1 天，速写页覆写；日期粒度，过期判定以当日为限），agent 即同步器"
usage:
  - 进域先读 wiki/cuhksz/bb/inbox.md（速写与域配置一体；缺席即建——bb-map 命令锚点触发或 agent 自发）；刷新流程 = 现拉公告+dues → 蒸馏重写速写（未交提醒双源：assignments 无提交 ∪ grades 有 due 无 attempt）→ 公告分拣派生 → log 行（类型 other）；stale 同此（agent 即同步器）
  - 拉取落位：课件 → cuhksz/bb/<term>/<course>/（保留源侧目录树）；提交件 → cuhksz/bb/<term>/<course>/submissions/；拉取物只增不覆写，同名变更件 --refresh 重拉、内容哈希尾缀落新件（旧件保留=修订史）；笔记区 notes/ 两治共居：人的笔记机器永不写入/删除/重命名（读取与分析合法——认知消费口粮）；ai 产物（origin: ai——teach 讲解笔记 / quiz 考卷）经各采集通道落放、只增不覆写；fetch 落放遇保留名冲突时改名并提示
  - 新学期/新课 = 建属地目录 + 身份页（bb 块映射 term_id/course_id）；bbcli 解析直接用目录名（--term 学期名、课程代码子串）
  - 物化分层：文档类全量；媒体类（video/audio）默认指针化不落 bb/——fetch 过滤参数（--exclude-mime/--exclude-ext/--max-size）见 bbcli skill，单元页清单登记未物化条目，按需 --match 单取
  - 公告拆信：不存档不立页（真相在 BB 现拉即得）；作业变更→assessments 机械区、考试/调课→info 基本信息（+calendar 派生）、政策/师资/分组→info 基本信息、行动项→todo、资源发布→触发 fetch 即弃、高价值长文→notes 涌现回链
  - 单向派生（只出不回）：行动项 → todo；课业日程 → calendar；高价值结论 → notes（回链属地页）——todo/calendar/notes 桥，格式细则归桥
  - 隐私与边界：成绩按需现拉呈现即止、不默认投影；roster 不拉；提交作业等写操作不入本域
checks:
  - 语义项（v0.1 人工，附检后置）：type: bb 页落 wiki/cuhksz/bb/ 之外 → error；身份页 bb 块映射缺 course_id 或与目录不对应 → error；速写页手编痕迹 → warning；stale 清单（信息级）
