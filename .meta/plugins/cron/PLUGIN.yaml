id: cron
version: 0.2
bridge: 按需
depends:
  - wiki
  - trust
  - log
updated: 2026-10-06
attachment:
  - "wiki/cron/ — time-automation territory (one page per task, pure-directory scheme — the directory is the full declaration set, no root declaration page, quick views via the derived index)"
  - "wiki/cron/<task name>.md — task page (type: cron; cron block mapping mechanical zone + two body sections)"
fields:
  cron: "block mapping (task page) — schedule (cadence: crontab 5-field or human-readable description, local timezone by default) / action (the action in one sentence) / form (execution shape: session edition | script edition — criterion: any agent-judgment step means session, purely mechanical means script) / domain (owning domain, tagged when a domain plugin registers via the bridge, omittable for cross-domain tasks) / status (active in-service | paused suspended | deprecated retired) / last_run (most recent run time, machine-maintained) / machine (optional: executing-machine anchor for multi-device location; v0.1 keeps only the key, no linkage built)"
inject: "Time-automation territory wiki/cron/ (one page per task, the pure directory = the full declaration set): task page type: cron + cron block mapping (schedule/action/form session|script/domain/status/last_run/machine) + ## Task + ## Run Notes append-only; declaration-as-source, executor-as-projection — replay lands active pages on the execution side (session edition → harness scheduler, script edition → system tasks upon user confirmation); reconciliation (declaration ↔ harness ↔ system three-way diff) in the check attached audit; intent-change sync both directions, the page is the source of truth; failures report via log, never blocking other tasks; boundaries — todo one-shot, calendar facts, cron recurring intent; on-demand bridge (domain tasks: page + depends)"
usage:
  - Registration (domain plugin via the bridge / direct human creation): build wiki/cron/<task name>.md — cron block mapping minimal key set (schedule/action/form/status) + a `## Task` section (action details: which command to call or what the session opening reads, back-linking the owning domain's skill); domain-plugin registrations tag domain and hang depends cron
  - Replay (deployment walkthrough / spontaneous agent session): read active task pages and land them on the execution side one by one — the session edition creates tasks via the current harness's scheduling facility, prompt self-contained (read wiki/cron/<task name>.md and execute per the page, report failures with a log line, never block other tasks); the script edition generates crontab lines / scheduled-task commands, system-state writes upon user confirmation; when tasks already on the execution side diff against the declarations, add and delete with the declaration pages as the authority
  - Run traces: a normal completion writes a log line (type other, tagging the task name) + a mechanical last_run update on the task page; anomalies enter `## Run Notes`, append-only and convergent; repair delegations → todo (one-way derivation)
  - Reconciliation (check attached-audit discipline): active page set ↔ execution-side task list diff drift → warning; last_run beyond the schedule period from today with status: active → warning; paused/deprecated pages still running on the execution side → error
  - Pause and deprecation: a human changes status → the agent synchronously deletes/stops the execution-side task upon confirmation; deprecated pages are never deleted (kept for the record)
checks:
  - Mechanical: a type: cron page landing outside wiki/cron/ → error; task page missing the cron block or the minimal key set (schedule/action/form/status) → warning; last_run beyond the schedule period with active → warning (projection-lost signal)
  - Semantic (attached audit deferred): drift between the execution-side list (harness/system tasks, best-effort read) and the declaration page set → warning
