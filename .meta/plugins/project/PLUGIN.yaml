id: project
version: 0.3
depends:
  - domain
  - wiki
updated: 2026-09-22
attachment:
  - "projects/ —— 项目容器（根下第三容器，工作区：agent 全权读写；一项目一目录）"
  - "wiki/projects.md —— 声明页（`projects` 块映射 = 项目名→一句话；双向 diff 漂移检测，structure 先例）"
fields:
  projects: "块映射（声明页）——项目名 → 一句话定位；键应与 projects/ 下目录一一对应（双向 diff）"
inject: "项目容器 `projects/<项目名>/`（工作区，agent 全权读写——与 vault 只增相对）：项目本体与跟踪全住文件夹，惯例自述 `project.md`（四区：目标与上下文 / 阶段（checkbox+日期）/ 任务（行不建页）/ 决策（只增）；stage 规划/进行/暂停/完成开放词表）；wiki 端仅声明页 `wiki/projects.md`（type: project，`projects` 块映射 = 项目名→一句话，与目录双向 diff，漂移同 structure）；涉及项目内容的检索直查 projects/ 子树；与 todo 边界——todo 是 agent 委托活工作集，project.md 任务是持久分解事实源"
usage:
  - 建项目：`projects/` 下建目录 + `project.md` 自述（四区起步可空），声明页补一行（键 = 目录名）
  - 任务流转：自述内 `[ ]`→`[x]` 完成留痕（不删行）；阶段 checkbox 同理
  - 漂移处置：check 报未声明目录 / 无目录声明 → 补声明或迁移，处置属人
  - 检索：涉及项目内容时直查 `projects/<名>/` 子树（wiki 索引不覆盖容器）
checks:
  - 语义项（v0.1 人工，附检后置）：type: project 落 `wiki/projects.md` 之外 → error；声明键无对应目录 / 目录未声明 → warning（双向 diff）；进行中项目自述 updated 超 30 天 → warning（停滞分诊）
